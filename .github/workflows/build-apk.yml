name: Build APK

on:
  workflow_dispatch:

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses; ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager 'ndk;28.2.13676358' 'build-tools;36.0.0'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: ./patch.sh -n
      - run: ./gradlew :backends:fetchCryptoSources
      - run: rustup toolchain install
      - run: cargo install cargo-ndk@4.1.2
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false
          if-no-files-found: error
