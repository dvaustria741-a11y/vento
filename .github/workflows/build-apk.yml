name: Build APK

on:
  workflow_dispatch:

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - run: yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --licenses; ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager 'ndk;28.2.13676358' 'build-tools;36.0.0'
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: ./patch.sh -n
      - run: ./gradlew :backends:fetchCryptoSources
      - run: rustup toolchain install
      - run: cargo install cargo-ndk@4.1.2
      - name: Set versionCode from run number (CI checkout only, not committed)
        run: sed -i -E "s/^( *versionCode )[0-9]+/\1$((1000 + GITHUB_RUN_NUMBER))/" app/build.gradle && grep -n "versionCode" app/build.gradle
      - run: ./gradlew :app:assembleRelease
      - name: Sign APK
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign --v1-signing-enabled false --alignment-preserved --ks "$RUNNER_TEMP/keystore.jks" --ks-pass env:KEYSTORE_PASSWORD --in app/build/outputs/apk/release/app-release-unsigned.apk --out Vento.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs Vento.apk
          rm -f "$RUNNER_TEMP/keystore.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          path: Vento.apk
          archive: false
          if-no-files-found: error
